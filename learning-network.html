<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Network</title>
<meta name="description" content="A daily learning ritual: pick a topic, research it, log what you learned and watch your neural network grow.">
<meta name="theme-color" content="#F3EEE4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E1B18'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23F3EEE4'/%3E%3Cpath d='M16 5v4M16 23v4M5 16h4M23 16h4M8.2 8.2l2.8 2.8M21 21l2.8 2.8M23.8 8.2L21 11M11 21l-2.8 2.8' stroke='%23F3EEE4' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5C564E}a:hover{color:#1E1B18}
.lnw-root,.lnw-root button,.lnw-root textarea{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.lnw-btn{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,background-color .18s ease}
.lnw-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(30,27,24,.55)}
.lnw-btn:active{transform:translateY(0) scale(.97)}
.lnw-root button:focus-visible,.lnw-root textarea:focus-visible{outline:2px solid #A0644F;outline-offset:3px}
.lnw-ghost{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.lnw-ghost:hover{background-color:rgba(30,27,24,.07)}
.lnw-ink{transition:background-color .15s ease,transform .15s ease}
.lnw-ink:hover{background-color:#38332D}
.lnw-ink:active{transform:scale(.98)}
.lnw-dark-btn{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.lnw-dark-btn:hover{background-color:rgba(241,232,211,.08);border-color:rgba(241,232,211,.5)}
.lnw-cream-btn{transition:background-color .15s ease,transform .15s ease}
.lnw-cream-btn:hover{background-color:#FFF8E8}
.lnw-cream-btn:active{transform:scale(.98)}
.lnw-hint{transition:opacity .8s ease}
.lnw-backdrop{animation:lnwFade .35s ease both}
.lnw-card{animation:lnwRise .5s cubic-bezier(.2,.8,.2,1) both}
.lnw-swap-a{animation:lnwSwapA .45s cubic-bezier(.2,.8,.2,1) both}
.lnw-swap-b{animation:lnwSwapB .45s cubic-bezier(.2,.8,.2,1) both}
.lnw-timer{animation:lnwFade .6s ease both}
.lnw-drawer{animation:lnwSlide .4s cubic-bezier(.2,.8,.2,1) both}
.lnw-tip{animation:lnwTip .22s cubic-bezier(.2,.8,.2,1) both}
.lnw-tile{position:relative;overflow:hidden}
.lnw-tile::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#0E0C0A;box-shadow:0 1px 0 rgba(241,232,211,.05)}
.lnw-tile::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(241,232,211,.035),rgba(241,232,211,0))}
.lnw-flap-a{display:inline-block;animation:lnwFlapA .46s cubic-bezier(.3,.75,.2,1) both;transform-origin:50% 50%}
.lnw-flap-b{display:inline-block;animation:lnwFlapB .46s cubic-bezier(.3,.75,.2,1) both;transform-origin:50% 50%}
.lnw-blink{animation:lnwBlink 1.6s ease-in-out infinite}
.lnw-out-bg{animation:lnwOutBg .32s ease forwards;pointer-events:none}
.lnw-out-card{animation:lnwOutCard .32s cubic-bezier(.4,0,.6,1) forwards}
.lnw-toast{animation:lnwToast 3s ease forwards}
.lnw-area{transition:border-color .15s ease,background-color .15s ease}
.lnw-area:focus{border-color:#1E1B18;background-color:#FFFDF8;outline:none}
.lnw-area::placeholder{color:#8F877C}
@keyframes lnwFade{from{opacity:0}to{opacity:1}}
@keyframes lnwRise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes lnwSwapA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lnwSwapB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lnwSlide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes lnwTip{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes lnwFlapA{0%{transform:perspective(700px) rotateX(-62deg);opacity:.25;filter:blur(1.5px)}100%{transform:none;opacity:1;filter:none}}
@keyframes lnwFlapB{0%{transform:perspective(700px) rotateX(-62deg);opacity:.25;filter:blur(1.5px)}100%{transform:none;opacity:1;filter:none}}
@keyframes lnwOutBg{from{opacity:1}to{opacity:0}}
@keyframes lnwOutCard{from{opacity:1;transform:none}to{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes lnwToast{0%{opacity:0;transform:translateX(16px)}10%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(8px)}}
@keyframes lnwBlink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.lnw-card,.lnw-backdrop,.lnw-swap-a,.lnw-swap-b,.lnw-timer,.lnw-drawer,.lnw-tip,.lnw-flap-a,.lnw-flap-b,.lnw-blink{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="app-tpl">
<div class="lnw-root" style="position: relative; width: 100%; height: 100vh; min-height: 600px; overflow: hidden; background-color: #F3EEE4; color: #1E1B18">
<canvas ref="{{setCanvas}}" role="img" aria-label="{{ariaLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab"></canvas>

<div style="position: absolute; top: 24px; left: 28px; display: flex; flex-direction: column; gap: 10px; pointer-events: none">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em">LEARNING NETWORK <span style="font-weight: 400; color: #6B645B">/ v0.2 · local</span></p>
<div style="display: flex; border: 1px solid rgba(30,27,24,0.22); background-color: rgba(243,238,228,0.88)">
<div style="padding: 10px 16px 11px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)">
<span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">TOPICS COMPLETED</span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: 0.02em; font-variant-numeric: tabular-nums">{{completedLabel}}</span>
</div>
<div style="padding: 10px 16px 11px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)">
<span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">TIME SPENT LEARNING</span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: 0.02em; font-variant-numeric: tabular-nums">{{timeLabel}}</span>
</div>
<div style="padding: 10px 16px 11px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">CLUSTERS</span>
<span style="display: flex; gap: 6px; align-items: center; height: 26px">
<sc-for list="{{clusters}}" as="cl" hint-placeholder-count="1">
<span style="width: 8px; height: 8px; border-radius: 50%; display: block; background-color: {{cl.color}}"></span>
</sc-for>
</span>
</div>
</div>
</div>

<div style="position: absolute; top: 26px; right: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; font-size: 11px; letter-spacing: 0.1em; color: #6B645B">
<span>{{dateLabel}}</span>
<span style="display: flex; align-items: center; gap: 7px"><span style="width: 6px; height: 6px; border-radius: 50%; display: block; background-color: #5E7A64"></span>{{savedLabel}}</span>
<button type="button" class="lnw-ghost" onClick="{{openLibrary}}" style="pointer-events: auto; margin-top: 6px; height: 40px; padding: 0 14px; border: 1px solid rgba(30,27,24,0.22); background-color: rgba(243,238,228,0.9); color: #1E1B18; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; display: flex; align-items: center; gap: 10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8 1 -3.6 14 -3.8-1"></path></svg>LIBRARY · {{libLeft}} / {{libTotal}} LEFT</button>
</div>

<p class="lnw-hint" style="position: absolute; left: 28px; bottom: 32px; margin: 0; font-size: 11px; letter-spacing: 0.08em; color: #6B645B; pointer-events: none; opacity: {{hintOpacity}}">DRAG · PAN &#160;&#160; SCROLL · ZOOM &#160;&#160; HOVER · RECALL</p>

<div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 10px; letter-spacing: 0.14em; color: #6B645B; pointer-events: none">{{nextLabel}}</span>
<button type="button" class="lnw-btn" onClick="{{openTopic}}" style="height: 56px; padding: 0 28px 0 22px; border: 0; border-radius: 999px; background-color: #1E1B18; color: #F3EEE4; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; display: flex; align-items: center; gap: 12px; cursor: pointer; box-shadow: 0 6px 18px -10px rgba(30,27,24,0.6)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"></path></svg>
<span>Learn something new</span>
</button>
</div>

<div style="position: absolute; right: 28px; bottom: 30px; display: flex; align-items: center; border: 1px solid rgba(30,27,24,0.22); background-color: rgba(243,238,228,0.9)">
<button type="button" class="lnw-ghost" onClick="{{zoomOut}}" aria-label="Zoom out" style="width: 44px; height: 44px; border: 0; background-color: transparent; color: #1E1B18; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #1E1B18; font-variant-numeric: tabular-nums; border-left: 1px solid rgba(30,27,24,0.22); border-right: 1px solid rgba(30,27,24,0.22)">{{zoomLabel}}</span>
<button type="button" class="lnw-ghost" onClick="{{zoomIn}}" aria-label="Zoom in" style="width: 44px; height: 44px; border: 0; background-color: transparent; color: #1E1B18; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
<button type="button" class="lnw-ghost" onClick="{{fit}}" aria-label="Fit whole network" style="width: 44px; height: 44px; border: 0; border-left: 1px solid rgba(30,27,24,0.22); background-color: transparent; color: #1E1B18; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg></button>
</div>

<sc-if value="{{hovShow}}" hint-placeholder-val="{{ false }}">
<div class="lnw-tip" style="position: absolute; left: {{hovX}}px; top: {{hovY}}px; width: 288px; box-sizing: border-box; padding: 14px 16px 16px; background-color: #FBF8F1; border: 1px solid #1E1B18; box-shadow: 4px 4px 0 rgba(30,27,24,0.9); pointer-events: none; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 0.12em; color: #6B645B"><span>№ {{hovNo}} · {{hovTitle}}</span></div>
<span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B; border-top: 1px dashed rgba(30,27,24,0.35); padding-top: 10px">MOST INTERESTING THING I LEARNED</span>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{hovA}}</p>
<span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">{{hovDate}} · {{hovDur}}</span>
</div>
</sc-if>

<sc-if value="{{toastShow}}" hint-placeholder-val="{{ false }}">
<div class="lnw-toast" role="status" style="position: absolute; right: 28px; bottom: 96px; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background-color: #FBF8F1; border: 1px solid rgba(30,27,24,0.3); font-size: 12px; letter-spacing: 0.04em; color: #1E1B18; pointer-events: none">
<span style="width: 6px; height: 6px; border-radius: 50%; display: block; background-color: #A0644F"></span>
<span>{{toastText}}</span>
</div>
</sc-if>

<input type="file" ref="{{setFileInput}}" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" onChange="{{onFile}}" aria-hidden="true" style="display: none">

<sc-if value="{{showLibrary}}" hint-placeholder-val="{{ false }}">
<div class="lnw-backdrop" style="position: absolute; inset: 0; background-color: rgba(243,238,228,0.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<div class="lnw-card" role="dialog" aria-modal="true" aria-labelledby="lnw-lib-title" onKeyDown="{{dialogKey}}" style="width: 100%; max-width: 600px; max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box; background-color: #FBF8F1; border: 1px solid #1E1B18; box-shadow: 6px 6px 0 rgba(30,27,24,0.92)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; height: 44px; border-bottom: 1px solid #1E1B18; font-size: 11px; letter-spacing: 0.14em">
<span id="lnw-lib-title">TOPIC LIBRARY</span>
<button type="button" ref="{{setPrimary}}" class="lnw-ghost" onClick="{{closeTopic}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; background-color: transparent; color: #1E1B18; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>
<div style="padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{libBanner}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 16px; background-color: #1E1B18; color: #F3EEE4; font-size: 13px; line-height: 1.6">Every topic in this library is learned. Import a new file to keep your network growing.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid rgba(30,27,24,0.22)">
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">TOPICS</span><span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">{{libTotal}}</span></div>
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">LEARNED</span><span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">{{libLearned}}</span></div>
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">STILL TO LEARN</span><span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">{{libLeft}}</span></div>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 10px; letter-spacing: 0.14em; color: #6B645B; padding-bottom: 8px">SOURCES</span>
<sc-for list="{{libImports}}" as="im" hint-placeholder-count="1">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px dashed rgba(30,27,24,0.28); font-size: 13px"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{im.name}}</span><span style="flex-shrink: 0; font-size: 11px; letter-spacing: 0.08em; color: #6B645B">{{im.meta}}</span></div>
</sc-for>
</div>
<div onDragOver="{{onDragOver}}" onDragLeave="{{onDragLeave}}" onDrop="{{onDrop}}" style="border: 1px dashed {{dropBorder}}; background-color: {{dropBg}}; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; transition: background-color .15s ease, border-color .15s ease">
<span style="font-size: 13px; color: #3D3832">Drop an .xlsx or .csv file here</span>
<button type="button" class="lnw-ink" onClick="{{pickFile}}" style="height: 44px; padding: 0 18px; border: 0; background-color: #1E1B18; color: #F3EEE4; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 20h16"></path></svg>{{importLabel}}</button>
<sc-if value="{{libHasMsg}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 12px; line-height: 1.5; color: {{libMsgColor}}">{{libMsgText}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; line-height: 1.6; color: #6B645B">
<span>First row: Topic ID · Topic · Category · Research time (min) · Curiosity hook · Research question 1–4. Only “Topic” is required.</span>
<span>New topics are added to this library. Topics you’ve already logged are skipped and never come back.</span>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{showTopic}}" hint-placeholder-val="{{ false }}">
<div class="lnw-backdrop" style="position: absolute; inset: 0; background-color: rgba(243,238,228,0.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<div class="lnw-card" role="dialog" aria-modal="true" aria-labelledby="lnw-topic-title" onKeyDown="{{dialogKey}}" style="width: 100%; max-width: 600px; max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box; background-color: #FBF8F1; border: 1px solid #1E1B18; box-shadow: 6px 6px 0 rgba(30,27,24,0.92)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; height: 44px; border-bottom: 1px solid #1E1B18; font-size: 11px; letter-spacing: 0.14em">
<span>TOPIC № {{tNo}}</span>
<span style="display: flex; align-items: center; gap: 12px"><span style="color: #6B645B">{{tCat}}</span>
<button type="button" class="lnw-ghost" onClick="{{closeTopic}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; background-color: transparent; color: #1E1B18; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></span>
</div>
<div class="{{swapClass}}" style="padding: 28px 28px 8px; display: flex; flex-direction: column; gap: 16px">
<h2 id="lnw-topic-title" style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em">{{tTitle}}</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3D3832">{{tIntro}}</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid rgba(30,27,24,0.22)">
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">ALLOCATED</span><span style="font-size: 16px; font-weight: 500">{{tTime}}</span></div>
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(30,27,24,0.22)"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">CATEGORY</span><span style="font-size: 16px; font-weight: 500">{{tCatPlain}}</span></div>
<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 0.12em; color: #6B645B">QUESTIONS</span><span style="font-size: 16px; font-weight: 500">{{tQCount}}</span></div>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 10px; letter-spacing: 0.14em; color: #6B645B; padding-bottom: 8px">KEY QUESTIONS TO INVESTIGATE</span>
<sc-for list="{{tQs}}" as="q" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; padding: 11px 0; border-top: 1px dashed rgba(30,27,24,0.28); font-size: 13px; line-height: 1.55"><span style="color: #6B645B; flex-shrink: 0">{{q.n}}</span><span>{{q.text}}</span></div>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px 20px 20px">
<button type="button" class="lnw-ghost" onClick="{{shuffleTopic}}" style="height: 44px; padding: 0 14px; border: 1px solid rgba(30,27,24,0.25); background-color: transparent; color: #1E1B18; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"></path></svg>Another topic</button>

  // ---------- hover recall ----------
  hoverAt(p){
    if (!this.figs || ((this.state && this.state.screen) || 'home') !== 'home') return;

      if (Math.hypot(wx - f.cx, wy - f.cy) > f.R + 10) continue;
      for (const c of f.circ){ if (Math.hypot(wx - c[0], wy - c[1]) < c[2] * 1.25 + 6 / z) { hit = f; break; } }

  }
  updateHoverCard(force){

    const sx = (f.cx - this.cam.x) * z + this.W/2, sy = (f.cy - this.cam.y) * z + this.H/2, r = f.R * z * 0.7;
    let x = sx + r + 16, y = sy - Hh / 2;

  // ---------- world ----------

        const n = 6; for (let i = 1; i < n; i++){ const s = i / n; const o = (r() - 0.5) * 5 * k; ctx.lineTo(A[0] + dx*s + nx*o, A[1] + dy*s + ny*o); }
        ctx.lineTo(B[0], B[1]); ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    // dash-dot rays echoing the spark motif
    const e = lnwEaseOutCubic(t); const n = 8; const rr = lnwRng((b.seed * 13) | 0);
    ctx.strokeStyle = b.color; ctx.fillStyle = b.color; ctx.lineCap = 'round'; ctx.lineWidth = 1.5 * k + 0.3;
    ctx.globalAlpha = Math.pow(1 - t, 1.4) * (0.5 + 0.5 * k);
    for (let i = 0; i < n; i++){
      const an = i / n * Math.PI * 2 + rr() * 0.5;
      const r0 = 5 + e * 7 * k, r1 = r0 + 4 + 4 * k, rd = r1 + 2.6 + 2 * e;
      const c = Math.cos(an), s = Math.sin(an);
      ctx.beginPath(); ctx.moveTo(g.m[0] + c*r0, g.m[1] + s*r0); ctx.lineTo(g.m[0] + c*r1, g.m[1] + s*r1); ctx.stroke();
      ctx.beginPath(); ctx.arc(g.m[0] + c*rd, g.m[1] + s*rd, 0.9 * k + 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}
